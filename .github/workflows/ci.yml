name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, race tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/server

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  paperscraper:
    name: Python sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/paperscraper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/paperscraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest test_ieee -v

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build app image
        # goproxy.cn is the Dockerfile default for mainland builds; CI runs abroad.
        run: docker build --build-arg GOPROXY=https://proxy.golang.org,direct -t paper-assistant:ci .
      - name: Build paperscraper image
        run: docker build -t paperscraper:ci services/paperscraper
